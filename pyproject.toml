[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caep"
version = "0.2.0"
description = "Coding Agent Evaluation Protocol: reliability and evidence layer for coding-agent evaluations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "CAEP contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
caep = "caep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
